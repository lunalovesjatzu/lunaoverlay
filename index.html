<style>
:root{--bg:#eaf1fc;--fg:#10224a;--pn:#fff;--pr:#4a6fa5;--ac:#e3b93c;--ck:#4a6fa51a;color-scheme:light;box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}

body{margin:0;background:conic-gradient(var(--ck) 25%,#0000 0 50%,var(--ck) 0 75%,#0000 0) 0 0/56px 56px,var(--bg);color:var(--fg);font:500 15px/1.3 'Zen Maru Gothic',system-ui,sans-serif;min-height:100vh}

.side{display:flex;flex-direction:column;gap:9px}

.ca0{animation:c0 calc(.6s/var(--as)) cubic-bezier(.2,.9,.2,1) backwards}.ca1{animation:c1 calc(.55s/var(--as)) cubic-bezier(.2,.9,.2,1) backwards}.ca2{animation:c2 calc(.7s/var(--as)) steps(1,end) backwards}.ca3{animation:c3 calc(.8s/var(--as)) steps(14,end) backwards}.ca4{animation:c4 calc(.6s/var(--as)) ease-out backwards}.ca5{animation:c5 calc(.7s/var(--as)) cubic-bezier(.3,1.5,.5,1) backwards}.ca6{animation:c6 calc(.7s/var(--as)) ease-out backwards}

@keyframes c1{from{clip-path:inset(48% -20% 48% -20%);filter:brightness(2.6)}to{clip-path:inset(-60% -20% -60% -20%)}}

@keyframes c3{from{clip-path:inset(-60% 100% -60% -20%)}to{clip-path:inset(-60% -20% -60% -20%)}}
